paths_file: "configs/paths_colab_geolift.yaml"

seed: 42
device: "cuda"

data:
  image_size: [352, 1216]
  output_scale: 4
  num_workers: 2
  depth_scale: 256.0
  load_metric_teacher: true
  metric_teacher_train_only: true

model:
  name: "GeoLift-S3-Lite-Teacher-KD"
  architecture: "geolift_s3_lite"
  encoder: "mobilenetv4_conv_small_050.e3000_r224_in1k"
  encoder_pretrained: true

student:
  max_depth: 120.0

sparse_propagation:
  scale: 4
  radius: 7
  mode: "local_normalized_pyramid"

train:
  epochs: 20
  batch_size: 2
  lr: 0.0002
  weight_decay: 0.00001
  amp: true
  amp_dtype: "float16"
  fused_adamw: true
  grad_clip_norm: 1.0
  scheduler: "cosine"
  # Match the original 30-epoch baseline LR trajectory while evaluating at epoch 20.
  scheduler_total_epochs: 30
  warmup_epochs: 1.0
  min_lr_ratio: 0.05
  channels_last: true
  data_parallel: false
  distributed: false
  find_unused_parameters: false
  compile: false
  deterministic: false
  float32_matmul_precision: "high"
  resume: null

loss:
  objective: "s3_teacher_kd"

  # Exact teacher-free S3 base objective.
  lambda_metric: 1.0
  lambda_log: 0.2
  lambda_sparse: 0.1
  lambda_edge: 0.05
  metric_huber_delta: 1.0
  multiscale_weights:
    D16: 0.05
    D8: 0.10
    D4: 0.25
    D2: 0.50
    D1: 1.00

  # The only ablation variables: metric and fused-geometry teacher terms.
  lambda_cm: 0.20
  lambda_G: 0.03
  lambda_ord: 0.01
  calibrate_metric_teacher: false
  require_dense_metric_teacher: true
  require_geometry_teacher: true
  geometry_fallback: false
  min_dense_metric_pixels: 1024
  metric_conf_min: 0.05
  geometry_conf_threshold: 0.4
  geometry_min_valid_pixels: 512
  ordinal_temperature: 0.05
  ordinal_offsets: [1, 4, 8]
  ordinal_rgb_tau: 0.04
  ordinal_geom_tau: 0.10
  ordinal_require_geometry_edge: true

  min_depth: 0.001
  max_depth: 120.0
  range_bins: [0.0, 20.0, 40.0, 60.0, 80.0, 120.0]

mono_ssi:
  enabled: false
  weight: 0.0
  key: "D_da_raw"

schedule:
  add_teacher_epoch: 0
  teacher_ramp_epochs: 3
  add_geometry_epoch: 3
  geometry_ramp_epochs: 3

teacher_checks:
  enabled: true
  require_metric: true
  require_geometry: true
  require_geometry_fused: true
  min_metric_coverage: 1.0
  min_geometry_coverage: 1.0

outputs:
  save_every: 1
  save_visuals: true
