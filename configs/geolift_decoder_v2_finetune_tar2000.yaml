paths_file: "configs/paths_colab_geolift.yaml"

seed: 42
device: "cuda"

data:
  image_size: [352, 1216]
  output_scale: 4
  num_workers: 2
  depth_scale: 256.0
  load_metric_teacher: false

model:
  name: "GeoLift-Decoder-V2"
  architecture: "geolift_decoder_v2"
  encoder: "mobilenetv4_conv_small_050.e3000_r224_in1k"
  encoder_pretrained: true
  metric_residual_limit: 5.0

student:
  max_depth: 120.0

sparse_propagation:
  scale: 4
  radius: 7
  mode: "local_normalized_pyramid"

train:
  epochs: 10
  batch_size: 2
  lr: 0.00005
  encoder_lr_multiplier: 0.25
  new_head_lr_multiplier: 2.0
  new_head_patterns:
    - "lift8_4.metric_"
    - "lift8_4.sparse_metric_project"
    - "f2_project"
    - "f2_alpha"
  weight_decay: 0.00001
  amp: true
  amp_dtype: "float16"
  fused_adamw: true
  grad_clip_norm: 1.0
  scheduler: "cosine"
  warmup_epochs: 1.0
  min_lr_ratio: 0.05
  channels_last: true
  data_parallel: false
  distributed: false
  find_unused_parameters: false
  compile: false
  deterministic: false
  float32_matmul_precision: "high"
  resume: null
  init_checkpoint: null
  init_strict: false
  init_allowed_missing_prefixes:
    - "lift8_4.metric_"
    - "lift8_4.sparse_metric_project"
    - "f2_project"
    - "f2_alpha"

# Intentionally identical to the S3 baseline objective.
loss:
  objective: "s3_lite"
  lambda_metric: 1.0
  lambda_log: 0.2
  lambda_sparse: 0.1
  lambda_edge: 0.05
  metric_huber_delta: 1.0
  multiscale_weights:
    D16: 0.05
    D8: 0.10
    D4: 0.25
    D2: 0.50
    D1: 1.00
  lambda_G: 0.0
  lambda_ord: 0.0
  geometry_fallback: false
  min_depth: 0.001
  max_depth: 120.0
  range_bins: [0.0, 20.0, 40.0, 60.0, 80.0, 120.0]

mono_ssi:
  enabled: false
  weight: 0.0
  key: "D_da_raw"

schedule: {}

teacher_checks:
  enabled: false
  require_metric: false
  require_geometry: false
  require_geometry_fused: false

evaluation:
  depth_audit:
    enabled: true
    protocol_min_depth: 0.001
    protocol_max_depth: 120.0
    thresholds: [0.01, 0.05, 0.1, 0.5]
    top_k: 100

outputs:
  save_every: 1
  save_visuals: true
